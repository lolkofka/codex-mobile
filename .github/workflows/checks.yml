name: Build and check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Check source
        run: python tools/check_project.py
      - name: Check bundled interface
        run: python tests/run_ui_tests.py --browser /usr/bin/google-chrome
      - name: Build client and temporary instrumentation
        run: |
          python tools/build.py
          python tools/build_native_tests.py
      - uses: actions/upload-artifact@v4
        with:
          name: development-apks
          path: dist/
