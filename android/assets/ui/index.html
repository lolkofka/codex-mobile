<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark"><link rel="stylesheet" href="chat.css"><script defer src="chat.js"></script><title>Codex</title></head>
<body><div id="app">
<header class="topbar"><button class="icon-button" id="menu" aria-label="История чатов" data-icon="menu"></button><button class="model-title" id="model-button"><span id="model-name">Codex</span><span data-icon="chevron"></span></button><button class="icon-button" id="new-chat" aria-label="Новый чат" data-icon="new"></button></header>
<main id="scroll"><section id="welcome"><div class="welcome-inner"><h1>Чем я могу помочь?</h1><div class="suggestions"><button data-prompt="Покажи запущенные Docker-контейнеры на этом телефоне."><span data-icon="box"></span>Мои контейнеры</button><button data-prompt="Проверь состояние Android, root и доступное место. Ничего не меняй."><span data-icon="phone"></span>Проверить телефон</button></div></div></section><section id="messages"></section><div id="pending" hidden><span class="thinking-dot"></span><span>Думаю…</span></div><div class="scroll-spacer"></div></main>
<button id="to-bottom" class="icon-button" aria-label="К последнему сообщению" hidden data-icon="down"></button>
<footer><section id="outbox" aria-label="Очередь сообщений" hidden><div class="outbox-heading"><span id="outbox-title">В очереди</span><button id="queue-toggle"></button></div><div id="queued-messages"></div></section><div class="composer"><div id="attachments" aria-label="Прикреплённые изображения" hidden></div><textarea id="prompt" rows="1" placeholder="Спросить Codex" aria-label="Сообщение"></textarea><div class="composer-settings"><button id="composer-model" class="effort-chip" aria-label="Выбрать модель"><span id="composer-model-name">Модель · авто</span><span class="tiny" data-icon="chevron"></span></button><button id="effort-button" class="effort-chip"><span data-icon="spark"></span><span id="effort-name">Размышление</span><span class="tiny" data-icon="chevron"></span></button></div><div class="composer-actions"><button id="attach" class="icon-button" aria-label="Добавить изображение" data-icon="plus"></button><button id="delivery-button" class="effort-chip" hidden><span id="delivery-name">В очередь</span><span class="tiny" data-icon="chevron"></span></button><div class="flex"></div><button id="mic" class="icon-button" aria-label="Продиктовать" data-icon="mic"></button><button id="stop" class="icon-button" aria-label="Остановить задачу" hidden data-icon="stop"></button><button id="voice" class="primary icon-button" aria-label="Голосовой диалог" data-icon="wave"></button><button id="send" class="primary icon-button" aria-label="Отправить" hidden data-icon="up"></button></div></div><button id="connection" class="connection">Подключаюсь…</button></footer>
</div>
<div id="drawer-backdrop" class="backdrop" hidden></div><aside id="drawer" aria-label="История чатов" aria-hidden="true"><div class="drawer-top"><button class="icon-button" id="close-drawer" aria-label="Закрыть" data-icon="menu"></button><span>Codex</span><button class="icon-button" id="drawer-new" aria-label="Новый чат" data-icon="new"></button></div><label class="search"><span data-icon="search"></span><input id="chat-search" placeholder="Поиск чатов" autocomplete="off"></label><div class="drawer-label">Чаты</div><div id="chat-list"></div><button id="more-chats" class="subtle" hidden>Загрузить ещё</button><button id="account-button" class="account-row"><span class="avatar">C</span><span id="account-label">Аккаунт ChatGPT</span><span data-icon="dots"></span></button></aside>
<div id="sheet-backdrop" class="backdrop" hidden></div><section id="sheet" role="dialog" aria-modal="true" aria-hidden="true"><div class="sheet-handle"></div><div id="sheet-content"></div></section><div id="toast" role="status"></div>
</body></html>
